<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Diagnostic AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b; /* Zinc 950 */
            --text-color: #ffffff;
            --text-muted: #a1a1aa; /* Zinc 400 */
            --accent-color: #6366f1; /* Indigo 500 */
            --accent-hover: #4f46e5;
            --border-color: #27272a; /* Zinc 800 */
            --card-bg: #18181b; /* Zinc 900 */
            --result-bg: #0c0a13; /* Very dark deep contrast */
        }

        [data-theme="light"] {
            --bg-color: #f8fafc; /* Slate 50 */
            --text-color: #0f172a; /* Slate 900 */
            --text-muted: #475569; /* Slate 600 */
            --accent-color: #4f46e5; /* Indigo 600 */
            --accent-hover: #4338ca;
            --border-color: #cbd5e1; /* Slate 300 */
            --card-bg: #ffffff; /* White */
            --result-bg: #ffffff; /* White */
        }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .search-box:hover {
            transform: translateY(-2px);
        }

        input {
            flex: 1;
            padding: 0.85rem 1.2rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            padding: 0.85rem 1.75rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(99, 102, 241, 0.4);
        }
        
        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
            font-style: italic;
            color: #94a3b8;
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #result {
            display: none;
            background: var(--result-bg);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            line-height: 1.7;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error {
            color: #ef4444;
            background: #450a0a;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid #7f1d1d;
            display: none;
            margin-bottom: 1rem;
        }

        /* Premium Markdown Styles */
        #reportContent {
            color: var(--text-color);
        }

        #reportContent h1, #reportContent h2, #reportContent h3 {
            margin-top: 1.8em;
            margin-bottom: 0.8em;
            color: var(--text-color);
            text-align: left;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        #reportContent h3 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        #reportContent p { margin-bottom: 1.2em; color: var(--text-muted); }
        
        #reportContent ul, #reportContent ol { 
            margin-bottom: 1.5em; 
            padding-left: 1.5rem; 
            color: var(--text-color);
        }
        
        #reportContent li { 
            margin-bottom: 0.6em; 
        }
        
        #reportContent li > ul {
            margin-top: 0.6em;
            margin-bottom: 0;
            color: var(--text-muted);
            border-left: 2px solid var(--border-color);
            padding-left: 1rem;
            list-style-type: circle;
        }

        #reportContent strong {
            color: var(--text-color);
            font-weight: 600;
        }

        #reportContent code { 
            background: var(--border-color); 
            padding: 0.2em 0.4em; 
            border-radius: 4px; 
            font-family: monospace; 
            color: var(--accent-color);
        }
        
        #reportContent pre { 
            background: var(--card-bg); 
            padding: 1.5em; 
            border-radius: 8px; 
            overflow-x: auto; 
            border: 1px solid var(--border-color);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: flex-end;
        }

        .action-buttons button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            box-shadow: none;
            background-image: none;
        }

        .action-buttons button:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }

        .history-section {
            width: 100%;
            margin-top: 3rem;
        }

        .history-section h2 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .history-tag {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .history-tag:hover {
            background: var(--border-color);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        .header-container h1 {
            margin-bottom: 0;
            flex: 1;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: none;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }
    </style>
    <!-- Incluir biblioteca marked para converter Markdown em HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <div></div> <!-- Espaçador para centralizar o h1 se necessário, ou flex resolve -->
            <h1>Domain Diagnostic AI</h1>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">
                <span id="themeIcon">☀️</span>
            </button>
        </div>
        
        <div class="search-box" style="flex-direction: column;">
            <div style="display: flex; gap: 1rem; width: 100%;">
                <input type="text" id="domainInput" placeholder="Ex: google.com (Obrigatório)" autocomplete="off" spellcheck="false" required style="flex: 2;">
                <button id="searchBtn" onclick="consultarDominio()">Analisar</button>
            </div>
            <div style="display: flex; gap: 1rem; width: 100%;">
                <input type="text" id="cnpjInput" placeholder="CNPJ (Opcional)" autocomplete="off" spellcheck="false">
                <input type="text" id="cepInput" placeholder="CEP (Opcional)" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <div id="errorBox" class="error"></div>

        <div id="loading">
            <div class="loading-spinner"></div>
            <div>Analisando infraestrutura e gerando relatório IA... Isso pode levar alguns segundos.</div>
        </div>

        <div id="result">
            <div id="reportContent"></div>
            <div class="action-buttons">
                <button onclick="copiarRelatorio()">Copiar Relatório</button>
                <button onclick="baixarPDF()">Baixar PDF</button>
            </div>
        </div>

        <div class="history-section" id="historySection" style="display: none;">
            <h2>Consultas Recentes</h2>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        async function consultarDominio() {
            const domainInput = document.getElementById('domainInput');
            const cnpjInput = document.getElementById('cnpjInput');
            const cepInput = document.getElementById('cepInput');
            const searchBtn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorBox = document.getElementById('errorBox');
            const reportContent = document.getElementById('reportContent');

            const dominio = domainInput.value.trim();
            const cnpj = cnpjInput.value.trim();
            const cep = cepInput.value.trim();

            if (!dominio) {
                showError('Por favor, digite um domínio válido.');
                return;
            }

            // Reset state
            errorBox.style.display = 'none';
            result.style.display = 'none';
            loading.style.display = 'block';
            searchBtn.disabled = true;
            domainInput.disabled = true;
            cnpjInput.disabled = true;
            cepInput.disabled = true;

            try {
                // Determine API URL based on environment
                let queryParams = `?dominio=${encodeURIComponent(dominio)}`;
                if (cnpj) queryParams += `&cnpj=${encodeURIComponent(cnpj)}`;
                if (cep) queryParams += `&cep=${encodeURIComponent(cep)}`;

                const apiUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                    ? `http://${window.location.host}/api/consultar${queryParams}`
                    : `/api/consultar${queryParams}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.erro || 'Ocorreu um erro ao consultar o domínio.');
                }

                // Render Markdown using marked.js
                reportContent.innerHTML = marked.parse(data.relatorio_ia);
                
                loading.style.display = 'none';
                result.style.display = 'block';

                addToHistory(dominio, data.relatorio_ia);
            } catch (error) {
                loading.style.display = 'none';
                showError(error.message);
            } finally {
                searchBtn.disabled = false;
                domainInput.disabled = false;
                cnpjInput.disabled = false;
                cepInput.disabled = false;
            }
        }

        // Add Enter key listener
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                consultarDominio();
            }
        }
        document.getElementById('domainInput').addEventListener('keypress', handleKeyPress);
        document.getElementById('cnpjInput').addEventListener('keypress', handleKeyPress);
        document.getElementById('cepInput').addEventListener('keypress', handleKeyPress);
        
        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        function copiarRelatorio() {
            const reportText = document.getElementById('reportContent').innerText;
            navigator.clipboard.writeText(reportText).then(() => {
                alert('Relatório copiado para a área de transferência!');
            });
        }

        function baixarPDF() {
            const element = document.getElementById('reportContent');
            const domainValue = document.getElementById('domainInput').value.trim() || 'dominio';
            
            const isLightMode = document.documentElement.getAttribute('data-theme') === 'light';
            const pdfBgColor = isLightMode ? '#ffffff' : '#0c0a13';
            const pdfTextColor = isLightMode ? '#0f172a' : '#ffffff';
            const pdfMutedColor = isLightMode ? '#475569' : '#a1a1aa';
            const pdfBorderColor = isLightMode ? '#cbd5e1' : '#27272a';
            const pdfCardBg = isLightMode ? '#ffffff' : '#18181b';

            // O html2canvas (usado pelo html2pdf) tem bugs conhecidos com variáveis CSS.
            // Injetamos um estilo temporário com cores hex literais para a exportação.
            const style = document.createElement('style');
            style.id = 'pdf-fix-style';
            style.innerHTML = `
                #reportContent { color: ${pdfTextColor} !important; background-color: ${pdfBgColor} !important; }
                #reportContent h1, #reportContent h2, #reportContent h3 { color: ${pdfTextColor} !important; }
                #reportContent h3 { border-bottom-color: ${pdfBorderColor} !important; }
                #reportContent p { color: ${pdfMutedColor} !important; }
                #reportContent ul, #reportContent ol { color: ${pdfTextColor} !important; }
                #reportContent li { color: ${pdfTextColor} !important; }
                #reportContent li > ul { color: ${pdfMutedColor} !important; border-left-color: ${pdfBorderColor} !important; }
                #reportContent strong { color: ${pdfTextColor} !important; }
                #reportContent code { background-color: ${pdfBorderColor} !important; }
                #reportContent pre { background-color: ${pdfCardBg} !important; border-color: ${pdfBorderColor} !important; }
            `;
            document.head.appendChild(style);

            const opt = {
                margin:       0.5,
                filename:     `diagnostico-${domainValue}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, backgroundColor: pdfBgColor },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                // Remove o estilo temporário após a geração do PDF
                const styleElement = document.getElementById('pdf-fix-style');
                if (styleElement) {
                    styleElement.remove();
                }
            });
        }

        // Theme Management
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            icon.textContent = theme === 'light' ? '🌙' : '☀️';
        }

        // Initialize Theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        let history = JSON.parse(localStorage.getItem('domainHistory') || '[]');

        function renderHistory() {
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');
            if (history.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            historySection.style.display = 'block';
            historyList.innerHTML = '';
            history.forEach((item, index) => {
                const tag = document.createElement('div');
                tag.className = 'history-tag';
                tag.textContent = item.dominio;
                tag.onclick = () => carregarDoHistorico(index);
                historyList.appendChild(tag);
            });
        }

        function carregarDoHistorico(index) {
            const item = history[index];
            document.getElementById('domainInput').value = item.dominio;
            document.getElementById('cnpjInput').value = '';
            document.getElementById('cepInput').value = '';
            document.getElementById('reportContent').innerHTML = marked.parse(item.relatorio_ia);
            document.getElementById('result').style.display = 'block';
            document.getElementById('errorBox').style.display = 'none';
            window.scrollTo({ top: document.getElementById('result').offsetTop, behavior: 'smooth' });
        }

        function addToHistory(dominio, relatorio_ia) {
            history = history.filter(h => h.dominio !== dominio);
            history.unshift({ dominio, relatorio_ia, data: new Date().toISOString() });
            if (history.length > 10) history.pop();
            localStorage.setItem('domainHistory', JSON.stringify(history));
            renderHistory();
        }

        renderHistory();
    </script>
</body>
</html>
