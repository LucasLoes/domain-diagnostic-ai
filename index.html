<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Diagnostic AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
            --card-bg: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background: #2563eb;
        }
        
        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
            font-style: italic;
            color: #94a3b8;
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #result {
            display: none;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
        }

        .error {
            color: #ef4444;
            background: #450a0a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #7f1d1d;
            display: none;
            margin-bottom: 1rem;
        }

        /* Basic Markdown Styles */
        #result h1, #result h2, #result h3 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            color: #e2e8f0;
            text-align: left;
            -webkit-text-fill-color: initial;
            background: none;
        }
        
        #result p { margin-bottom: 1em; }
        #result ul, #result ol { margin-bottom: 1em; padding-left: 20px; }
        #result li { margin-bottom: 0.25em; }
        #result code { background: #0f172a; padding: 0.2em 0.4em; border-radius: 4px; font-family: monospace; }
        #result pre { background: #0f172a; padding: 1em; border-radius: 8px; overflow-x: auto; }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: flex-end;
        }

        .action-buttons button {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .action-buttons button:hover {
            background: var(--border-color);
        }

        .history-section {
            width: 100%;
            margin-top: 3rem;
        }

        .history-section h2 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .history-tag {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .history-tag:hover {
            background: var(--border-color);
        }
    </style>
    <!-- Incluir biblioteca marked para converter Markdown em HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Domain Diagnostic AI</h1>
        
        <div class="search-box" style="flex-direction: column;">
            <div style="display: flex; gap: 1rem; width: 100%;">
                <input type="text" id="domainInput" placeholder="Ex: google.com (Obrigatório)" autocomplete="off" spellcheck="false" required style="flex: 2;">
                <button id="searchBtn" onclick="consultarDominio()">Analisar</button>
            </div>
            <div style="display: flex; gap: 1rem; width: 100%;">
                <input type="text" id="cnpjInput" placeholder="CNPJ (Opcional)" autocomplete="off" spellcheck="false">
                <input type="text" id="cepInput" placeholder="CEP (Opcional)" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <div id="errorBox" class="error"></div>

        <div id="loading">
            <div class="loading-spinner"></div>
            <div>Analisando infraestrutura e gerando relatório IA... Isso pode levar alguns segundos.</div>
        </div>

        <div id="result">
            <div id="reportContent"></div>
            <div class="action-buttons">
                <button onclick="copiarRelatorio()">Copiar Relatório</button>
                <button onclick="baixarPDF()">Baixar PDF</button>
            </div>
        </div>

        <div class="history-section" id="historySection" style="display: none;">
            <h2>Consultas Recentes</h2>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        async function consultarDominio() {
            const domainInput = document.getElementById('domainInput');
            const cnpjInput = document.getElementById('cnpjInput');
            const cepInput = document.getElementById('cepInput');
            const searchBtn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorBox = document.getElementById('errorBox');
            const reportContent = document.getElementById('reportContent');

            const dominio = domainInput.value.trim();
            const cnpj = cnpjInput.value.trim();
            const cep = cepInput.value.trim();

            if (!dominio) {
                showError('Por favor, digite um domínio válido.');
                return;
            }

            // Reset state
            errorBox.style.display = 'none';
            result.style.display = 'none';
            loading.style.display = 'block';
            searchBtn.disabled = true;
            domainInput.disabled = true;
            cnpjInput.disabled = true;
            cepInput.disabled = true;

            try {
                // Determine API URL based on environment
                let queryParams = `?dominio=${encodeURIComponent(dominio)}`;
                if (cnpj) queryParams += `&cnpj=${encodeURIComponent(cnpj)}`;
                if (cep) queryParams += `&cep=${encodeURIComponent(cep)}`;

                const apiUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                    ? `http://${window.location.host}/api/consultar${queryParams}`
                    : `/api/consultar${queryParams}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.erro || 'Ocorreu um erro ao consultar o domínio.');
                }

                // Render Markdown using marked.js
                reportContent.innerHTML = marked.parse(data.relatorio_ia);
                
                loading.style.display = 'none';
                result.style.display = 'block';

                addToHistory(dominio, data.relatorio_ia);
            } catch (error) {
                loading.style.display = 'none';
                showError(error.message);
            } finally {
                searchBtn.disabled = false;
                domainInput.disabled = false;
                cnpjInput.disabled = false;
                cepInput.disabled = false;
            }
        }

        // Add Enter key listener
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                consultarDominio();
            }
        }
        document.getElementById('domainInput').addEventListener('keypress', handleKeyPress);
        document.getElementById('cnpjInput').addEventListener('keypress', handleKeyPress);
        document.getElementById('cepInput').addEventListener('keypress', handleKeyPress);
        
        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        function copiarRelatorio() {
            const reportText = document.getElementById('reportContent').innerText;
            navigator.clipboard.writeText(reportText).then(() => {
                alert('Relatório copiado para a área de transferência!');
            });
        }

        function baixarPDF() {
            const element = document.getElementById('reportContent');
            const domainValue = document.getElementById('domainInput').value.trim() || 'dominio';
            const opt = {
                margin:       0.5,
                filename:     `diagnostico-${domainValue}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        let history = JSON.parse(localStorage.getItem('domainHistory') || '[]');

        function renderHistory() {
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');
            if (history.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            historySection.style.display = 'block';
            historyList.innerHTML = '';
            history.forEach((item, index) => {
                const tag = document.createElement('div');
                tag.className = 'history-tag';
                tag.textContent = item.dominio;
                tag.onclick = () => carregarDoHistorico(index);
                historyList.appendChild(tag);
            });
        }

        function carregarDoHistorico(index) {
            const item = history[index];
            document.getElementById('domainInput').value = item.dominio;
            document.getElementById('cnpjInput').value = '';
            document.getElementById('cepInput').value = '';
            document.getElementById('reportContent').innerHTML = marked.parse(item.relatorio_ia);
            document.getElementById('result').style.display = 'block';
            document.getElementById('errorBox').style.display = 'none';
            window.scrollTo({ top: document.getElementById('result').offsetTop, behavior: 'smooth' });
        }

        function addToHistory(dominio, relatorio_ia) {
            history = history.filter(h => h.dominio !== dominio);
            history.unshift({ dominio, relatorio_ia, data: new Date().toISOString() });
            if (history.length > 10) history.pop();
            localStorage.setItem('domainHistory', JSON.stringify(history));
            renderHistory();
        }

        renderHistory();
    </script>
</body>
</html>
